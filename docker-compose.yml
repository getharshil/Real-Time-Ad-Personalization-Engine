version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: adplatform-db
    environment:
      POSTGRES_DB: adplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: adplatform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adplatform-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adplatform
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/adplatform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      DEBUG: "true"
      MODEL_PATH: ml_models/ctr_model.pkl
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/ml_models:/app/ml_models

  # Frontend (nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adplatform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
